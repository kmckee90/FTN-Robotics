# Portable model preset for either MT50 or MT10. Explicit CLI flags win.
# MT10 disables archive-based replay and keeps its segment co-training semantics.
model: lora
ftn_hidden_size: 2304
ftn_k: 256
ftn_inner_size: 8
ftn_layers: 8
ftn_dropout_p: 0.0
ftn_square_dim: 48
lateral_steps: 0
lateral_polyak: 1.0
lateral_kernel: 3
lateral_noise_sd: 0.0
lateral_torus: false
reconfig_steps: 60
reconfig_lr: 0.3
mask_init_noise_scale: 0.00001
mask_warm_start: false
no_mask: false
fixed_mask: false
stored_mask: false
consolidate: true
replay_max_chunks: 4
replay_max_tuples: 1024
rho_low: 0.2
rho_high: 0.8
lora_layers: 6
lora_width: 256
lora_rank: 1
lora_alpha: 64.0
lora_weight_scale: 1.0
lora_b0_scale: 0.01
lora_dropout: 0.0
lora_bias: true
lora_reconfig_algorithm: annealste
lora_reconfig_optimizer: Adam
lora_warm_start_reconfig: false
lora_reactive_continuous_updates: false
lora_changepoint_reconfig_steps: 30
lora_match_stored: false
lora_match_stored_after: 0
lora_match_stored_topk: 1
reconfig_noise_scale: 1.0
reconfig_overlap_mode: bump
reconfig_overlap_lambda: 0.0
reconfig_overlap_threshold: 0.5
reconfig_overlap_temperature: 0.2
reconfig_reactive: false
reconfig_reactive_sd: 5.0
reconfig_reactive_ema: 0.95
eval_reconfig_lr: 0.3
eval_reconfig_sample_size: null
eval_reconfig_temperature: 1.0
eval_reconfig_restarts: 1
eval_reconfig_take_best: false
